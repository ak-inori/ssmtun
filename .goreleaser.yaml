version: 2

project_name: ssmtun

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/ssmtun
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/ak-inori/ssmtun/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^ci:", "^chore:"]

release:
  github:
    owner: ak-inori
    name: ssmtun
  draft: false
